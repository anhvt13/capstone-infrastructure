# Upstream dependency: "infrastructure-deployment" workflow was executed successful
name: Bootstrap Application Secrets

on:
  # Only allows manually start this GitHub Actions workflow
  workflow_dispatch:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-southeast-1

jobs:
  bootstrap-secrets:
    name: Bootstrap Application Secrets
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::249899229305:role/github-actions-bootstrap-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Bootstrap BFF TLS secrets into Secrets Manager
        env:
          BFF_CLIENT_KEYSTORE_P12_BASE64: ${{ secrets.BFF_CLIENT_KEYSTORE_P12_BASE64 }}
          BFF_SERVER_KEYSTORE_P12_BASE64: ${{ secrets.BFF_SERVER_KEYSTORE_P12_BASE64 }}
          BFF_TRUSTSTORE_BASE64:          ${{ secrets.BFF_TRUSTSTORE_BASE64 }}
          BFF_CLIENT_KEYSTORE_PASSWORD:   ${{ secrets.BFF_CLIENT_KEYSTORE_PASSWORD }}
          BFF_SERVER_KEYSTORE_PASSWORD:   ${{ secrets.BFF_SERVER_KEYSTORE_PASSWORD }}
          BFF_TRUSTSTORE_PASSWORD:        ${{ secrets.BFF_TRUSTSTORE_PASSWORD }}

        # No dedicated GitHub Action exists for PutSecretValue. Use the AWS CLI directly.
        run: |
          python3 - <<'PY'
          import json
          import os
          secret = {
              "bff_client_keystore_base64":   os.environ["BFF_CLIENT_KEYSTORE_P12_BASE64"],
              "bff_server_keystore_base64":   os.environ["BFF_SERVER_KEYSTORE_P12_BASE64"],
              "bff_truststore_base64":        os.environ["BFF_TRUSTSTORE_BASE64"],
              "bff_client_keystore_password": os.environ["BFF_CLIENT_KEYSTORE_PASSWORD"],
              "bff_server_keystore_password": os.environ["BFF_SERVER_KEYSTORE_PASSWORD"],
              "bff_truststore_password":      os.environ["BFF_TRUSTSTORE_PASSWORD"],
          }
          with open("/tmp/bff-tls.json", "w") as f:
              json.dump(secret, f)
          PY
          
          aws secretsmanager put-secret-value \
            --secret-id capstone/bff/tls \
            --secret-string file:///tmp/bff-tls.json

      - name: Bootstrap BFF OAuth2 credentials into Secrets Manager
        env:
          DRIVER_M2M_CLIENT_ID: ${{ secrets.DRIVER_M2M_CLIENT_ID }}
          DRIVER_M2M_CLIENT_SECRET: ${{ secrets.DRIVER_M2M_CLIENT_SECRET }}

        run: |
          python3 - <<'PY'
          import json
          import os
          secret = {
              "driver_m2m_client_id" :        os.environ["DRIVER_M2M_CLIENT_ID"],
              "driver_m2m_client_secret":     os.environ["DRIVER_M2M_CLIENT_SECRET"]
          }
          with open("/tmp/bff-oauth2.json", "w") as f:
              json.dump(secret, f)
          PY
          
          aws secretsmanager put-secret-value \
            --secret-id capstone/bff/oauth2 \
            --secret-string file:///tmp/bff-oauth2.json

      - name: Bootstrap Driver service TLS secrets into Secrets Manager
        env:
          DRIVER_SERVICE_KEYSTORE_BASE64:   ${{ secrets.DRIVER_SERVICE_KEYSTORE_BASE64 }}
          DRIVER_SERVICE_TRUSTSTORE_BASE64: ${{ secrets.DRIVER_SERVICE_TRUSTSTORE_BASE64 }}
          DRIVER_SERVER_KEYSTORE_PASSWORD:  ${{ secrets.DRIVER_SERVER_KEYSTORE_PASSWORD }}
          DRIVER_TRUSTSTORE_PASSWORD:       ${{ secrets.DRIVER_TRUSTSTORE_PASSWORD }}

        run: |
          python3 - <<'PY'
          import json
          import os
          secret = {
              "driver_keystore_base64":       os.environ["DRIVER_SERVICE_KEYSTORE_BASE64"],
              "driver_truststore_base64":     os.environ["DRIVER_SERVICE_TRUSTSTORE_BASE64"],
              "driver_keystore_password":     os.environ["DRIVER_SERVER_KEYSTORE_PASSWORD"],
              "driver_truststore_password":   os.environ["DRIVER_TRUSTSTORE_PASSWORD"]
          }
          with open("/tmp/driver-tls.json", "w") as f:
              json.dump(secret, f)
          PY

          aws secretsmanager put-secret-value \
            --secret-id capstone/driver/tls \
            --secret-string file:///tmp/driver-tls.json

      - name: Infrastructure redeployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run infrastructure-deployment.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f ecs_desired_task=1
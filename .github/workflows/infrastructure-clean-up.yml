name: Capstone Infrastructure Cleanup

on:
  workflow_dispatch:
    branches:
      - main
    inputs:
      aws_region:
        description: "Target AWS region clean up"
        required: true
        type: choice
        default: ap-southeast-1
        options:
          - ap-southeast-1
          - ap-northeast-1

      ecs_desired_task:
        description: "Number of ECS desired task running"
        required: true
        type: number
        default: 1

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ inputs.aws_region || 'ap-southeast-1'}}
  ENABLED_DR: ${{ inputs.aws_region == 'ap-northeast-1' }}
  ECS_DESIRED_TASK: ${{ inputs.ecs_desired_task || 1 }}
  TF_WORKING_DIR: aws-infrastructure

# Infrastructure Destroy Job
jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::249899229305:role/github-actions-infrastructure-deployment-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install Blue/Green Lambda Hook Dependencies
        working-directory: aws-infrastructure/modules/function/driver-blue-green-hook-function
        run: |
          npm ci

      - name: Package Blue/Green Lambda Hook Function
        working-directory: aws-infrastructure/modules/function/driver-blue-green-hook-function
        run: |
          rm -f driver-blue-green-hook-function.zip
          
          zip -r driver-blue-green-hook-function.zip \
            index.mjs \
            package.json \
            package-lock.json \
            node_modules

      - name: Install Cognito JWT Authenticate Dependencies
        working-directory: aws-infrastructure/modules/function/edge-authenticate-function
        run: |
          npm ci

      - name: Package Cognito JWT Authenticate Lambda Edge Function
        working-directory: aws-infrastructure/modules/function/edge-authenticate-function
        run: |
          rm -f cognito-jwt-edge-auth-function.zip
          
          zip -r cognito-jwt-edge-auth-function.zip \
            index.mjs \
            package.json \
            package-lock.json \
            node_modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="enabled_dr=${{ env.ENABLED_DR }}" \
            -var="ecs_desired_task=${{ env.ECS_DESIRED_TASK}}"